services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tracker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tracker}
      POSTGRES_DB: tracker
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracker"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://tracker:${POSTGRES_PASSWORD:-tracker}@db:5432/tracker
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set in .env}
      NOMINATIM_USER_AGENT: ${NOMINATIM_USER_AGENT:-self-hosted-package-tracker/1.0}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8080}:80"
    depends_on:
      - backend

volumes:
  pg_data:
